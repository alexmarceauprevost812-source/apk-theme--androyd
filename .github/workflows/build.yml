name: Construire l'APK LexOS Démon

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.9"

      - name: Compiler
        run: gradle :app:assembleDebug --no-daemon

      - name: Renommer
        run: cp app/build/outputs/apk/debug/app-debug.apk lexos-demon.apk

      - uses: actions/upload-artifact@v4
        with:
          name: lexos-demon
          path: lexos-demon.apk

      - name: Publier dans Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: lexos-demon-v${{ github.run_number }}
          name: LexOS Démon 2.1 (build ${{ github.run_number }})
          body: Lanceur Android complet thème démon — toutes les applis, recherche, dock personnalisable, batterie, SMS avec animation, réglages.
          files: lexos-demon.apk
          make_latest: true
